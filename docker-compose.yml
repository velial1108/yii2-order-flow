services:
  app:
    build: ./docker/php-fpm
    ports:
      - "20080:80"
    volumes:
      - ./:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pgsql

  pgsql:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=yii2advanced
      - POSTGRES_USER=yii2advanced
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data

volumes:
  pgsql-data: