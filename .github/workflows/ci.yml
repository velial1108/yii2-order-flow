name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: postgres:16
        env:
          POSTGRES_DB: yii2advanced
          POSTGRES_USER: yii2advanced
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, intl, dom, json, curl, zip, xml, gd, bcmath, opcache
          coverage: none
          tools: composer:v2

      - name: Copy configs from dist
        run: |
          cp common/config/main-local.php.dist common/config/main-local.php
          cp common/config/test-local.php.dist common/config/test-local.php
          cp common/config/codeception-local.php.dist common/config/codeception-local.php
          
          cp frontend/config/main-local.php.dist frontend/config/main-local.php
          cp frontend/config/test-local.php.dist frontend/config/test-local.php
          cp frontend/config/codeception-local.php.dist frontend/config/codeception-local.php
          
          cp backend/config/main-local.php.dist backend/config/main-local.php
          cp backend/config/test-local.php.dist backend/config/test-local.php
          cp backend/config/codeception-local.php.dist backend/config/codeception-local.php

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Initialize Yii environment
        run: php init --env=Development --overwrite=All

      - name: Create test database
        run: |
          PGPASSWORD=secret psql -h localhost -U yii2advanced -d yii2advanced -c "CREATE DATABASE yii2advanced_test;"

      - name: Run migrations on test DB
        run: php yii_test migrate --interactive=0

      - name: Build Codeception actors
        run: vendor/bin/codecept build

      - name: Run Unit tests (common)
        run: vendor/bin/codecept run Unit -c common